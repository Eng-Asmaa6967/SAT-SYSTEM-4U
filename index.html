<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAT-SYSTEM | الشركة المصرية 4U</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#101114;--panel:#1b1d22;--panel2:#22252b;--line:#343840;--txt:#f7f5f0;--mut:#a9adb5;--gold:#f2b91d;--gold2:#ffd65a;--red:#e21e2b;--ok:#65c79a;--rose:#ff6870;--shadow:0 18px 50px #0008}
*{box-sizing:border-box;margin:0;padding:0;font-family:Cairo,Tahoma,"Segoe UI",Arial,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
html{background:var(--bg);scroll-behavior:smooth}
body{color:var(--txt);min-height:100vh;background:radial-gradient(ellipse at 8% 5%,#e21e2b12,transparent 36%),radial-gradient(ellipse at 92% 88%,#f2b91d12,transparent 38%),linear-gradient(135deg,#111216,#17191e 52%,#101114);overflow-x:hidden}
#ambient{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.78}
body:after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.13;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:46px 46px;mask-image:linear-gradient(to bottom,black,transparent 90%)}
.wrap{position:relative;z-index:1;max-width:1180px;margin:auto;padding:22px 18px 50px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:linear-gradient(120deg,#24262cF2,#15171cf2);border:1px solid #ffffff1c;border-radius:22px;padding:14px 18px;margin-bottom:20px;box-shadow:var(--shadow);position:relative;overflow:hidden;backdrop-filter:blur(14px)}
header:before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:linear-gradient(var(--red),var(--gold));box-shadow:0 0 22px #f2b91d80}
header:after{content:"";position:absolute;left:24px;right:24px;bottom:0;height:1px;background:linear-gradient(90deg,transparent,#f2b91d99,#e21e2b99,transparent)}
header img{height:54px;max-width:100px;object-fit:contain;border-radius:13px;background:#fff;padding:4px;box-shadow:0 4px 18px #0005}
.brand{display:flex;align-items:center;gap:13px;position:relative;z-index:1}
.brand b{display:block;font-size:21px;font-weight:800;letter-spacing:1.2px;white-space:nowrap;background:linear-gradient(90deg,#fff4cf,#f2b91d 60%,#e21e2b);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{color:#c2c4ca;font-weight:600;font-size:12px;letter-spacing:.25px}
button{background:linear-gradient(120deg,#ffe17a,#f2b91d 55%,#d99b00);color:#19170f;border:1px solid #ffe18b80;border-radius:12px;padding:10px 17px;font-weight:800;cursor:pointer;font-size:14px;box-shadow:0 7px 20px #f2b91d22;transition:transform .2s,box-shadow .2s,filter .2s}
button:hover{transform:translateY(-2px);box-shadow:0 10px 26px #f2b91d35;filter:brightness(1.06)}button:active{transform:translateY(0)}
button.k,button.g{background:linear-gradient(135deg,#30343c,#22252b);color:#f7d56d;border:1px solid #ffffff20;box-shadow:none}
button.del{background:#e21e2b12;color:#ff737b;border:1px solid #e21e2b55;padding:5px 11px;font-size:12px;box-shadow:none}
input,select{background:#121419;border:1px solid #454a54;color:var(--txt);border-radius:12px;padding:12px 13px;font-size:14px;width:100%;transition:border .2s,box-shadow .2s}
input::placeholder{color:#858b96}input:focus,select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px #f2b91d1c,0 0 18px #f2b91d0c}
option,optgroup{background:#1b1d22;color:var(--txt)}input[type=date],input[type=month]{color-scheme:dark}
.card{background:linear-gradient(145deg,#24272df2,#191b20f5);border:1px solid #ffffff17;border-radius:22px;padding:20px;margin-bottom:18px;box-shadow:var(--shadow);backdrop-filter:blur(12px);animation:cardIn .45s ease both;position:relative;overflow:hidden}
.card:before{content:"";position:absolute;inset:0 0 auto;height:2px;background:linear-gradient(90deg,transparent,#f2b91d90,#e21e2b70,transparent);opacity:.8}
@keyframes cardIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
h2{font-size:17px;margin-bottom:14px;display:flex;align-items:center;gap:9px;font-weight:800;color:#ffe18a;letter-spacing:.1px}
h2:before{content:"";width:4px;height:21px;border-radius:4px;background:linear-gradient(var(--red),var(--gold));box-shadow:0 0 12px #f2b91d55}
h2:after{content:" ✨";font-size:15px;opacity:.85}
.login{max-width:430px;margin:7vh auto;text-align:center;padding:34px 28px;background:linear-gradient(155deg,#282b32f5,#15171cf7);border:1px solid #ffffff24;border-top:3px solid var(--gold);box-shadow:0 28px 90px #000b;animation:loginIn .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes loginIn{from{opacity:0;transform:translateY(20px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.login img{width:min(82%,300px);max-height:190px;object-fit:contain;margin-bottom:15px;border-radius:17px;background:#fff;padding:10px;box-shadow:0 12px 35px #0005}
.login .tag{color:#c3c6cd;font-size:13px;margin-bottom:20px;line-height:2}.sat{letter-spacing:3px;font-size:24px;font-weight:900;background:linear-gradient(90deg,#fff2bf,#f2b91d 55%,#e21e2b);-webkit-background-clip:text;background-clip:text;color:transparent}
.login input{margin-bottom:12px;text-align:center}.login button{margin-top:4px;padding:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.stat{border-radius:18px;padding:17px;background:linear-gradient(145deg,#292c33,#1c1f25);border:1px solid #ffffff19;border-top:3px solid var(--gold);box-shadow:0 10px 26px #0003;transition:transform .2s,border-color .2s}.stat:hover{transform:translateY(-3px)}
.stat:nth-child(2){border-top-color:#e8e9ec}.stat:nth-child(3){border-top-color:var(--ok)}.stat.rem{border-top-color:var(--red)}
.stat small{color:#b5bac3;display:block;margin-bottom:7px;font-size:13px;font-weight:700}.stat b{font-size:25px;font-weight:900;letter-spacing:.3px}.stat.rem b,.old b{color:#ff727a}.stat.rem.ok b{color:var(--ok)}
.rep{cursor:pointer;text-align:center;padding:22px 12px;border-radius:22px;background:linear-gradient(145deg,#2a2d34,#1b1e24);border:1px solid #ffffff1b;transition:transform .25s,border-color .25s,box-shadow .25s;box-shadow:0 10px 28px #0003}.rep:hover{border-color:#f2b91d99;transform:translateY(-5px);box-shadow:0 16px 34px #0005,0 0 22px #f2b91d13}
.rep .ic{width:62px;height:62px;margin:auto;border-radius:19px;background:linear-gradient(145deg,#ffe58b,#f2b91d 60%,#d69a00);color:#242018;font-size:25px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px #ffffff0a,0 8px 22px #f2b91d25;transform:rotate(-3deg)}
.rep b{display:block;margin:12px 0 3px;font-size:16px}.rep small{color:#b5bac3}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;align-items:end}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;overflow:hidden;border-radius:12px}th,td{padding:11px 10px;text-align:right;border-bottom:1px solid #ffffff12}th{background:linear-gradient(120deg,#f8d75f,#e9a900);color:#211d11;font-size:13px;font-weight:900;padding:12px 10px}th:first-child{border-radius:0 10px 0 0}th:last-child{border-radius:10px 0 0 0}tr:hover td{background:#ffffff08}td:first-child{white-space:nowrap}tr.adm td{background:#f2b91d12}tr.adm:hover td{background:#f2b91d1c}
.bdg{background:linear-gradient(135deg,#ffe17a,#e9a900);color:#211d11;border-radius:999px;padding:2px 10px;font-size:11px;white-space:nowrap;font-weight:900}
.scroll{overflow-x:auto;border-radius:12px}.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:15px}.bar input{width:auto}.bar h2{margin:0}.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 9px;margin-bottom:14px}.chip{background:#272a31;color:#f6d66c;border:1px solid #ffffff22;white-space:nowrap;border-radius:999px;padding:8px 16px;box-shadow:none}.chip.on{background:linear-gradient(120deg,#ffe17a,#e9a900);color:#211d11;border-color:#ffe17a}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:17px}.hide{display:none}#print{display:none}
@media(max-width:600px){.wrap{padding:12px 10px 32px}.brand small{font-size:10px;white-space:nowrap}.brand b{font-size:18px}header{padding:12px}header button{padding:8px 12px;font-size:13px}header img{height:45px;width:78px}.card{padding:15px;border-radius:18px}.login{margin:5vh auto;padding:26px 18px}.stat b{font-size:22px}th,td{padding:9px 8px;font-size:12px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition:none!important}}
</style>
</head>

const KEY="masria_reps_v1";
let db=JSON.parse(localStorage.getItem(KEY)||"null")||{admin:{user:"admin",pass:"admin123"},reps:[],acts:[],pays:[],pkgs:[]};
db.pkgs=db.pkgs||[];
let session=null,viewRep=null,page=null,month=new Date().toLocaleDateString("en-CA").slice(0,7);
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fm=n=>Number(n).toLocaleString("en-US")+" ج";
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>new Date().toLocaleDateString("en-CA");
const cur=()=>today().slice(0,7);
const MN=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const mname=m=>MN[+m.slice(5)-1]+" "+m.slice(0,4);
function months(rid){const s=new Set([cur()]);db.acts.concat(db.pays).filter(x=>x.rep===rid).forEach(x=>s.add(x.date.slice(0,7)));return[...s].sort().reverse()}
const $=id=>document.getElementById(id);

function calc(rep,m){
  const a=db.acts.filter(x=>x.rep===rep),p=db.pays.filter(x=>x.rep===rep);
  if(!m){const ta=a.reduce((s,x)=>s+x.amount,0),tp=p.reduce((s,x)=>s+x.amount,0);return{before:0,A:a,P:p,ta,tp,rem:ta-tp}}
  const before=a.filter(x=>x.date.slice(0,7)<m).reduce((s,x)=>s+x.amount,0)-p.filter(x=>x.date.slice(0,7)<m).reduce((s,x)=>s+x.amount,0);
  const A=a.filter(x=>x.date.slice(0,7)===m),P=p.filter(x=>x.date.slice(0,7)===m);
  const ta=A.reduce((s,x)=>s+x.amount,0),tp=P.reduce((s,x)=>s+x.amount,0);
  return{before,A,P,ta,tp,rem:before+ta-tp};
}
function statsHTML(c){return `<div class="stat ${c.before>0?"old":""}"><small>رصيد قديم ${c.before>0?"(عليه)":c.before<0?"(له)":""}</small><b>${c.before>0?"-":c.before<0?"+":""}${fm(Math.abs(c.before))}</b></div>
 <div class="stat"><small>إجمالي التفعيلات</small><b>${fm(c.ta)}</b></div>
 <div class="stat"><small>إجمالي الدفعات</small><b>${fm(c.tp)}</b></div>
 <div class="stat rem ${c.rem<=0?"ok":""}"><small>المتبقي عليه</small><b>${fm(c.rem)}</b></div>`}

function render(){
  const app=$("app");document.body.className=session?"":"lg";if(session&&session.role!=="admin")month=cur();
  if(!session){
    app.innerHTML=`<div class="card login"><img src="${LOGO}"><div class="tag"><b class="sat">SAT-SYSTEM</b><br>نظام تفعيلات وحسابات المناديب</div>
    <input id="u" placeholder="اسم المستخدم"><input id="p" type="password" placeholder="كلمة السر" onkeydown="if(event.key=='Enter')login()">
    <button style="width:100%" onclick="login()">دخول</button></div>`;return;
  }
  const admin=session.role==="admin";
  let h=`<header><div class="brand"><img src="${EMB}"><div><b>SAT-SYSTEM</b><small>الشركة المصرية · AL MASRIA 4U</small></div></div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">`
   +((admin&&(viewRep||page))?`<button class="g" onclick="viewRep=null;page=null;render()">← المناديب</button>`:"")
   +`<button class="k" onclick="session=null;viewRep=null;page=null;render()">خروج</button></div></header>`;
  if(admin&&page==="pkgs"){
    app.innerHTML=h+`<div class="card"><h2>إضافة باقة</h2><div class="form"><input id="pn" placeholder="اسم الباقة أو الإضافة" oninput="autoType()"><input id="pp" type="number" placeholder="السعر"><select id="pt"><option value="open">مفتوحة (بدون جيجات)</option><option value="gb">بالجيجات</option><option value="addon">إضافة جيجات</option></select><button onclick="addPkg()">إضافة</button></div></div>
    <div class="card"><h2>كل الباقات (${db.pkgs.length})</h2><div class="scroll"><table><tr><th>الباقة</th><th>النوع</th><th>السعر</th><th></th></tr>`
    +db.pkgs.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.type==="open"?"مفتوحة":p.type==="addon"?"إضافة جيجات":"بالجيجات"}</td><td>${fm(p.price)}</td><td><button class="g" style="padding:4px 10px;font-size:12px" onclick="editPkg('${p.id}')">تعديل السعر</button> <button class="del" onclick="delPkg('${p.id}')">حذف</button></td></tr>`).join("")+`</table></div></div>`;return;

function makePDF(jp,w,h){
 const enc=new TextEncoder(),parts=[],off=[];let len=0;
 const push=d=>{const u=typeof d==="string"?enc.encode(d):d;parts.push(u);len+=u.length};
 const obj=(n,fn)=>{off[n]=len;push(n+" 0 obj\n");fn();push("\nendobj\n")};
 push("%PDF-1.4\n");const n=jp.length;
 obj(1,()=>push("<< /Type /Catalog /Pages 2 0 R >>"));
 obj(2,()=>push("<< /Type /Pages /Count "+n+" /Kids ["+jp.map((_,i)=>(3+i*3)+" 0 R").join(" ")+"] >>"));
 jp.forEach((j,i)=>{const p=3+i*3,c="q 595.28 0 0 841.89 0 0 cm /Im"+i+" Do Q";
  obj(p,()=>push("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im"+i+" "+(p+2)+" 0 R >> >> /Contents "+(p+1)+" 0 R >>"));
  obj(p+1,()=>push("<< /Length "+c.length+" >>\nstream\n"+c+"\nendstream"));
  obj(p+2,()=>{push("<< /Type /XObject /Subtype /Image /Width "+w+" /Height "+h+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+j.length+" >>\nstream\n");push(j);push("\nendstream")})});
 const total=3+n*3,xr=len;push("xref\n0 "+total+"\n0000000000 65535 f \n");
 for(let i=1;i<total;i++)push(String(off[i]).padStart(10,"0")+" 00000 n \n");
 push("trailer\n<< /Size "+total+" /Root 1 0 R >>\nstartxref\n"+xr+"\n%%EOF");
 return new Blob(parts,{type:"application/pdf"});
}
const rrect=(x,a,b,w,h,r)=>{x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()};
const loadImg=s=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=s});

  txt("كشف حساب مندوب",46,"#16161a",R,M+30,true);txt(rep.name,38,"#3b3b42",R,M+95,true);txt(label+" · "+today(),26,"#7b8190",R,M+150);

  st.forEach((s,i)=>{const xr=R-i*(bw+20),lx=xr-bw;x.fillStyle="#fcfbf8";rrect(x,lx,y,bw,130,16);x.fill();x.strokeStyle="#e9e4da";x.lineWidth=2;x.stroke();
    x.fillStyle=s[3];x.fillRect(lx+16,y,bw-32,6);txt(fit(s[0],bw-32),22,"#7b8190",xr-16,y+46);txt(fit(s[1],bw-32),32,s[2],xr-16,y+92,true)});
  y+=170;
  const table=(title,cols,rows)=>{
    const head=()=>{x.fillStyle="#16161a";rrect(x,M,y,TW,54,10);x.fill();let xr=R;cols.forEach(c=>{txt(c.h,24,"#f3e3c3",xr-14,y+27,true);xr-=c.w*TW});y+=54};

      x.fillStyle="#e9e4da";x.fillRect(M,y+53,TW,1);y+=54});

  table("التفعيلات",[{h:"التاريخ",w:.17},{h:"العميل",w:.24},{h:"الباقة",w:.44},{h:"المبلغ",w:.15}],c.A.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(a=>Object.assign([a.date,a.cust,a.pkg+(a.mode?" ("+a.mode+")":"")+(a.by==="admin"?" · إدارة":""),fm(a.amount)],{f:a.by==="admin"})));
  table("الدفعات",[{h:"التاريخ",w:.5},{h:"المبلغ",w:.5}],c.P.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(p=>[p.date,fm(p.amount)]));
  pages.forEach((p,i)=>{const g=p.getContext("2d");g.direction="rtl";g.textBaseline="middle";g.textAlign="center";g.font=F(22);g.fillStyle="#7b8190";g.fillText("SAT-SYSTEM · الشركة المصرية Al Masria 4U   |   صفحة "+(i+1)+" من "+pages.length,W/2,H-50)});
  const jp=pages.map(p=>{const b=atob(p.toDataURL("image/jpeg",.92).split(",")[1]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u});
  pdfModal(makePDF(jp,W,H),"كشف-حساب-"+rep.name+"-"+(m||"كامل")+".pdf");

function pdfModal(blob,name){
  const f=new File([blob],name,{type:"application/pdf"}),can=!!(navigator.canShare&&navigator.canShare({files:[f]}));
  const o=document.createElement("div");o.style.cssText="position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;z-index:100;padding:16px";
  o.innerHTML=`<div class="card" style="max-width:360px;width:100%;margin:0"><h2>الكشف جاهز ✓</h2><p style="margin-bottom:14px;color:var(--mut);font-size:13px;word-break:break-all">${esc(name)}</p><div style="display:flex;gap:8px;flex-wrap:wrap">${can?'<button id="ps" style="flex:1 1 100%">مشاركة (واتساب وغيره)</button>':""}<button class="y" id="pdl" style="flex:1">تحميل</button><button class="g" id="pcl" style="flex:1">إغلاق</button></div></div>`;
  document.body.appendChild(o);o.querySelector("#pcl").onclick=()=>o.remove();
  o.querySelector("#pdl").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove()};
  if(can)o.querySelector("#ps").onclick=()=>navigator.share({files:[f],title:name}).catch(()=>{});
}
function login(){

  if(u===db.admin.user&&p===db.admin.pass){session={role:"admin"};render();return}

  if(r){session={role:"rep",id:r.id,name:r.name};render()}else toast("بيانات الدخول غير صحيحة");
}

function toast(m){let t=$("tst");if(!t){t=document.createElement("div");t.id="tst";t.style.cssText="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#ecd08f;color:#16130a;font-weight:700;padding:12px 20px;border-radius:12px;z-index:200;box-shadow:0 8px 24px #0004;font-size:14px;max-width:90%;text-align:center";document.body.appendChild(t)}t.textContent=m;t.style.display="block";clearTimeout(t._t);t._t=setTimeout(()=>t.style.display="none",2800)}

function pkgOpts(){const o=p=>`<option value="${p.id}">${esc(p.name)} - ${p.price} ج</option>`,a=db.pkgs.filter(p=>p.type!=="addon"),b=db.pkgs.filter(p=>p.type==="addon");

function quote(){const p=db.pkgs.find(x=>x.id===$("apk").value);if(!p)return null;
  if(p.type==="addon")return{p,amt:p.price,mode:"إضافة جيجات",note:"إضافة جيجات - السعر كامل"};

  if($("adur").value!=="days")return{p,amt:p.price,mode:"شهر كامل",note:"باقة مفتوحة - شهر كامل"};

  return{p,amt:Math.round(p.price*rem/dim),mode:rem+" يوم",note:`باقة مفتوحة: ${rem} يوم من ${dim} يوم (${p.price} ÷ ${dim} × ${rem})`}}

<script>
(()=>{
 const canvas=document.getElementById('ambient'); if(!canvas)return;
 const ctx=canvas.getContext('2d'); let w=0,h=0,dpr=1,pts=[],raf=0;
 const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 function resize(){dpr=Math.min(window.devicePixelRatio||1,1.6);w=innerWidth;h=innerHeight;canvas.width=Math.floor(w*dpr);canvas.height=Math.floor(h*dpr);canvas.style.width=w+'px';canvas.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0);const n=Math.min(58,Math.max(24,Math.floor(w/24)));pts=Array.from({length:n},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.24,vy:(Math.random()-.5)*.24,r:Math.random()*1.7+.5,c:Math.random()>.72?'226,30,43':'242,185,29'}));}
 function draw(){ctx.clearRect(0,0,w,h);for(let i=0;i<pts.length;i++){const p=pts[i];if(!reduce){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;}ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(${p.c},.58)`;ctx.fill();for(let j=i+1;j<pts.length;j++){const q=pts[j],dx=p.x-q.x,dy=p.y-q.y,dist=Math.hypot(dx,dy);if(dist<125){ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.strokeStyle=`rgba(${p.c},${(1-dist/125)*.12})`;ctx.lineWidth=.7;ctx.stroke();}}}if(!reduce)raf=requestAnimationFrame(draw);}
 resize();draw();addEventListener('resize',()=>{cancelAnimationFrame(raf);resize();draw();},{passive:true});
})();
</script>
